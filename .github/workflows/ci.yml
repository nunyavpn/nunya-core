# Pull requests only. A push to main is covered by release.yml, which vets, tests and builds every
# platform before it publishes — running this as well would build the same commit twice.

name: ci

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install protoc plugins
        shell: bash
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # A dev build, unlike release.yml: this proves the tree compiles, and the parent check is the
      # one thing a PR cannot exercise anyway.
      - name: Build
        shell: bash
        run: ./scripts/build.sh

      # The same tag set build.sh just used, from scripts/tags.sh — vetting a different set
      # type-checks a different program from the one that ships.
      - name: Vet
        shell: bash
        run: go vet -tags "$(./scripts/tags.sh --dev)" ./...
      - name: Test
        shell: bash
        run: go test -tags "$(./scripts/tags.sh --dev)" ./...
