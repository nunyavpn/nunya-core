# Go, protoc and the two protoc plugins, set up identically for every job in the pipeline.
#
# Factored out because the pipeline has five stages that all need it, and a stage that installed a
# different toolchain would vet or test a different program from the one that ships.
#
# The plugin versions are PINNED, not @latest. This generates gen/*.pb.go, which is the wire contract
# with the client: with @latest, two builds of the same commit weeks apart can emit different code,
# and a release pipeline that is not reproducible cannot be audited. Bump these deliberately.

name: Go toolchain
description: Go with a warm module cache, protoc, and the pinned protoc-gen-go plugins.

inputs:
  protoc-gen-go:
    description: protoc-gen-go version
    default: v1.36.12
  protoc-gen-go-grpc:
    description: protoc-gen-go-grpc version
    default: v1.6.2

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    # Keyed on the versions above, so a bump installs fresh instead of restoring a stale binary.
    # Saves a compile of both plugins on every job after the first.
    - id: plugin-cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/go-plugins
        key: protoc-plugins-${{ runner.os }}-${{ runner.arch }}-${{ inputs.protoc-gen-go }}-${{ inputs.protoc-gen-go-grpc }}

    - name: Install the protoc plugins
      if: steps.plugin-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        GOBIN: ${{ runner.temp }}/go-plugins
      run: |
        go install google.golang.org/protobuf/cmd/protoc-gen-go@${{ inputs.protoc-gen-go }}
        go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@${{ inputs.protoc-gen-go-grpc }}

    - name: Put the plugins on PATH
      shell: bash
      run: echo "${{ runner.temp }}/go-plugins" >> "$GITHUB_PATH"

    - uses: arduino/setup-protoc@v3
      with:
        repo-token: ${{ github.token }}
